<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur d'Idées Business</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --card: #161616;
    --border: #222222;
    --accent: #c8ff00;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --success: #00ff88;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 1;
  }
  .header { text-align: center; margin-bottom: 48px; }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 14px;
    margin-bottom: 20px;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 10vw, 88px);
    line-height: 0.9;
    letter-spacing: 1px;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 15px; color: var(--muted); margin-top: 16px; font-weight: 300; }
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
    padding: 36px;
    margin-bottom: 32px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
  }
  input, textarea, select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--muted); font-size: 13px; }
  select option { background: var(--card); }
  .btn-generate {
    width: 100%;
    margin-top: 28px;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
  }
  .btn-generate:hover { background: #d4ff1a; transform: translateY(-1px); }
  .btn-generate:active { transform: translateY(0); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .loading { display: none; text-align: center; padding: 60px 20px; }
  .loading.active { display: block; }
  .loader-bar { width: 100%; height: 2px; background: var(--border); margin: 24px 0; overflow: hidden; }
  .loader-bar::after {
    content: '';
    display: block;
    height: 100%;
    background: var(--accent);
    animation: load 2s ease-in-out infinite;
    width: 40%;
  }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 2px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  #results { display: none; }
  .results-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .results-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; }
  .results-count {
    background: var(--accent);
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
  }
  .idea-card {
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    overflow: hidden;
    animation: slideIn 0.4s ease forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
  .idea-card:nth-child(1) { animation-delay: 0.05s; }
  .idea-card:nth-child(2) { animation-delay: 0.1s; }
  .idea-card:nth-child(3) { animation-delay: 0.15s; }
  .idea-card:nth-child(4) { animation-delay: 0.2s; }
  .idea-card:nth-child(5) { animation-delay: 0.25s; }
  .idea-card:nth-child(6) { animation-delay: 0.3s; }
  .idea-card:nth-child(7) { animation-delay: 0.35s; }
  .idea-card:nth-child(8) { animation-delay: 0.4s; }
  .idea-card:nth-child(9) { animation-delay: 0.45s; }
  .idea-card:nth-child(10) { animation-delay: 0.5s; }
  .idea-card.top3 { border-color: var(--accent); border-left: 3px solid var(--accent); }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 24px 28px 18px;
    cursor: pointer;
    gap: 16px;
  }
  .card-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--border);
    min-width: 52px;
  }
  .idea-card.top3 .card-number { color: var(--accent); opacity: 0.4; }
  .card-title {
    flex: 1;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .card-score {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .card-body { padding: 0 28px 24px; }
  .card-desc { font-size: 14px; color: #bbb; line-height: 1.6; margin-bottom: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .tag.accent { border-color: var(--accent); color: var(--accent); }
  .tag.orange { border-color: var(--accent2); color: var(--accent2); }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .metric { text-align: center; }
  .metric-value { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text); }
  .metric-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
  .btn-regen {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.2s;
    margin-left: auto;
  }
  .btn-regen:hover { background: var(--accent); color: #000; }
  .error-msg {
    background: #1a0808;
    border: 1px solid #ff4444;
    color: #ff6666;
    padding: 14px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 16px;
    display: none;
  }
  .error-msg.active { display: block; }
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .form-card { padding: 24px; }
    .results-header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="badge">AI POWERED</div>
    <h1>BUSINESS<br><span>GENERATOR</span></h1>
    <p class="subtitle">Génère des idées business personnalisées grâce à l'IA Claude</p>
  </div>

  <div class="form-card">
    <div class="form-grid">

      <div class="form-group">
        <label>Secteur / Domaine</label>
        <input type="text" id="sector" placeholder="ex: technologie, santé, alimentation..." />
      </div>

      <div class="form-group">
        <label>Budget initial</label>
        <select id="budget">
          <option value="">Sélectionner...</option>
          <option value="0 – 1 000 €">0 – 1 000 €</option>
          <option value="1 000 – 10 000 €">1 000 – 10 000 €</option>
          <option value="10 000 – 50 000 €">10 000 – 50 000 €</option>
          <option value="50 000 € et plus">50 000 € et plus</option>
        </select>
      </div>

      <div class="form-group">
        <label>Vos compétences</label>
        <input type="text" id="skills" placeholder="ex: marketing, développement, design..." />
      </div>

      <div class="form-group">
        <label>Marché cible</label>
        <select id="market">
          <option value="">Sélectionner...</option>
          <option value="B2C – Grand public">B2C – Grand public</option>
          <option value="B2B – Entreprises">B2B – Entreprises</option>
          <option value="B2B2C – Mixte">B2B2C – Mixte</option>
          <option value="Local / Physique">Local / Physique</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Contraintes ou préférences</label>
        <textarea id="constraints" rows="3" placeholder="ex: travail depuis chez soi, sans stock, impact social, passion pour..."></textarea>
      </div>

      <div class="form-group">
        <label>Nombre d'idées</label>
        <select id="count">
          <option value="3">3 idées</option>
          <option value="5" selected>5 idées</option>
          <option value="10">10 idées</option>
        </select>
      </div>

      <div class="form-group">
        <label>Clé API Claude</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." />
      </div>

    </div>

    <button class="btn-generate" id="generateBtn" onclick="generate()">GÉNÉRER MES IDÉES</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="loading" id="loading">
    <div class="loading-text">ANALYSE EN COURS...</div>
    <div class="loader-bar"></div>
    <div class="loading-text" style="font-size:11px; color: var(--muted); animation: none;">Claude génère vos idées business personnalisées</div>
  </div>

  <div id="results">
    <div class="results-header">
      <div class="results-title">VOS IDÉES</div>
      <div class="results-count" id="resultsCount">0</div>
      <button class="btn-regen" onclick="generate()">↻ RÉGÉNÉRER</button>
    </div>
    <div id="ideasContainer"></div>
  </div>

</div>

<script>
async function generate() {
  const sector      = document.getElementById('sector').value.trim();
  const budget      = document.getElementById('budget').value;
  const skills      = document.getElementById('skills').value.trim();
  const market      = document.getElementById('market').value;
  const constraints = document.getElementById('constraints').value.trim();
  const count       = document.getElementById('count').value;
  const apiKey      = document.getElementById('apiKey').value.trim();

  const errorEl = document.getElementById('errorMsg');
  errorEl.className = 'error-msg';

  if (!apiKey) {
    errorEl.textContent = 'ERROR: Clé API Claude requise (sk-ant-...)';
    errorEl.className = 'error-msg active';
    return;
  }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  document.getElementById('loading').className = 'loading active';
  document.getElementById('results').style.display = 'none';

  const prompt = `Génère ${count} idées de business innovantes et réalistes.

Contexte utilisateur :
- Secteur / domaine : ${sector || 'tous secteurs'}
- Budget initial : ${budget || 'flexible'}
- Compétences : ${skills || 'polyvalent'}
- Marché cible : ${market || 'à définir'}
- Contraintes / préférences : ${constraints || 'aucune'}

Pour chaque idée, réponds UNIQUEMENT avec un tableau JSON valide en utilisant cette structure exacte :
[
  {
    "rank": 1,
    "name": "Nom de l'idée",
    "tagline": "Une phrase d'accroche percutante",
    "description": "Description claire de 2-3 phrases expliquant le concept et la valeur ajoutée",
    "revenue_model": "Comment cette idée génère des revenus concrètement",
    "market_size": "Petit|Moyen|Grand",
    "difficulty": "Faible|Moyen|Élevé",
    "time_to_revenue": "ex: 1-3 mois",
    "score": 85,
    "tags": ["tag1", "tag2", "tag3"]
  }
]

Réponds UNIQUEMENT avec le JSON brut, sans texte avant ni après, sans bloc markdown.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: 4096,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || 'HTTP ' + response.status);
    }

    const data = await response.json();
    let raw = data.content[0].text.trim();

    // Strip possible markdown code fences
    raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();

    const ideas = JSON.parse(raw);
    renderIdeas(ideas);

  } catch (e) {
    errorEl.textContent = 'ERROR: ' + e.message;
    errorEl.className = 'error-msg active';
  } finally {
    btn.disabled = false;
    document.getElementById('loading').className = 'loading';
  }
}

function renderIdeas(ideas) {
  const container = document.getElementById('ideasContainer');
  container.innerHTML = '';

  document.getElementById('resultsCount').textContent = ideas.length + ' IDÉE' + (ideas.length > 1 ? 'S' : '');

  ideas.forEach((idea, i) => {
    const isTop3 = i < 3;
    const card = document.createElement('div');
    card.className = 'idea-card' + (isTop3 ? ' top3' : '');

    const rankStr = (i + 1) < 10 ? '0' + (i + 1) : String(i + 1);

    const tagsHtml = (idea.tags || []).map((t, ti) => {
      const cls = ti === 0 ? ' accent' : ti === 1 ? ' orange' : '';
      return `<span class="tag${cls}">${escHtml(t)}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="card-number">${rankStr}</div>
        <div class="card-title">${escHtml(idea.name)}</div>
        <div class="card-score">${idea.score}<span style="font-size:12px;color:var(--muted)">/100</span></div>
      </div>
      <div class="card-body">
        <div class="card-desc">
          <strong style="color:var(--text);display:block;margin-bottom:6px">${escHtml(idea.tagline)}</strong>
          ${escHtml(idea.description)}
        </div>
        <div class="tags">${tagsHtml}</div>
        <div style="font-size:13px;color:#aaa;margin-bottom:4px">
          <span style="color:var(--muted);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px">MODÈLE </span>${escHtml(idea.revenue_model)}
        </div>
        <div class="metrics">
          <div class="metric">
            <div class="metric-value">${escHtml(idea.market_size)}</div>
            <div class="metric-label">MARCHÉ</div>
          </div>
          <div class="metric">
            <div class="metric-value">${escHtml(idea.difficulty)}</div>
            <div class="metric-label">DIFFICULTÉ</div>
          </div>
          <div class="metric">
            <div class="metric-value">${escHtml(idea.time_to_revenue)}</div>
            <div class="metric-label">PREMIERS REVENUS</div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
